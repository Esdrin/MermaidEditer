name: 构建发布（Build Release）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# GitHub Releases 需要写入权限（创建/更新 Release）
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # 注意：不要用 npm run build:win（其 -c.electronDist 指向本机目录，CI 上不存在）
            build_cmd: npx electron-builder --win --publish never
          - os: ubuntu-latest
            build_cmd: npx electron-builder --linux --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install

      - name: 构建安装包
        run: ${{ matrix.build_cmd }}

      - name: 上传构建产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: MermaidEditor-${{ matrix.os }}
          path: |
            build-out/*.exe
            build-out/*.AppImage
            build-out/*.deb
            build-out/*.zip
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: 检出代码（读取 CHANGELOG）
        uses: actions/checkout@v4

      - name: 从 CHANGELOG 提取当前版本说明
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # 提取 "## [版本号]" 章节（到下一个 "## [" 为止）
          awk -v ver="[$VERSION]" '
            $0 ~ "^## \\[" { if (found) exit; if (index($0, ver) > 0) found=1; next }
            found { print }
          ' CHANGELOG.md > release-body.md
          # 若未匹配到版本章节，回退为整个 CHANGELOG
          if [ ! -s release-body.md ]; then cat CHANGELOG.md > release-body.md; fi
          echo "=== release body 预览 ==="
          head -20 release-body.md

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: |
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
